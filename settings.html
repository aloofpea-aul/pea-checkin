<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Settings PEA</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
:root{
  --primary:#005A9C;--primary-dark:#003f6e;--primary-light:#E3F0FB;
  --success:#2E7D32;--success-light:#E8F5E9;
  --danger:#C62828;--danger-light:#FFEBEE;
  --warning:#E65100;--warning-light:#FFF3E0;
  --bg:#F0F4F8;--card:#FFFFFF;--text:#1A2B3C;--muted:#6B7C8F;--border:#D1DCE8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:14px 16px;position:sticky;top:0;z-index:100;}
.header-title{font-size:16px;font-weight:700;}
.header-sub{font-size:11px;opacity:0.75;margin-top:2px;}
.tab-bar{display:flex;background:white;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:52px;z-index:99;}
.tab-btn{flex:none;padding:11px 14px;border:none;background:transparent;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}
.content{padding:12px;}
.tab-page{display:none;}.tab-page.active{display:block;}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,90,156,0.07);margin-bottom:12px;}
.card-title{font-size:13px;font-weight:700;margin-bottom:12px;}
.info-box{background:var(--primary-light);border-radius:10px;padding:12px;font-size:13px;color:var(--primary);margin-bottom:12px;line-height:1.6;}
.form-group{margin-bottom:14px;}
.form-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
.req{color:var(--danger);}
.form-input,.form-select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'Sarabun',sans-serif;font-size:15px;color:var(--text);background:white;outline:none;}
.form-input:focus,.form-select:focus{border-color:var(--primary);}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Sarabun',sans-serif;font-size:16px;font-weight:700;cursor:pointer;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{background:var(--primary);color:white;}
.btn-success{background:var(--success);color:white;}
.emp-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #F0F4F8;gap:10px;}
.emp-row:last-child{border-bottom:none;}
.emp-name{font-size:13px;font-weight:600;}
.emp-pos{font-size:11px;color:var(--muted);margin-top:1px;}
.emp-btn{border:none;border-radius:8px;padding:7px 14px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ci{background:var(--success-light);color:var(--success);}
.btn-co{background:var(--warning-light);color:var(--warning);}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px;}
.loading{text-align:center;padding:24px;color:var(--muted);font-size:13px;}
.spinner-sm{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 8px;}
.status-bar{display:flex;gap:10px;margin-bottom:14px;}
.status-box{flex:1;text-align:center;border-radius:10px;padding:10px;}
.status-box-label{font-size:11px;color:var(--muted);}
.status-box-val{font-size:18px;font-weight:700;margin-top:2px;}
.badge-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.tag-y{background:var(--warning-light);color:var(--warning);}
.tag-g{background:var(--success-light);color:var(--success);}
.uid-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #F0F4F8;}
.uid-row:last-child{border-bottom:none;}
.uid-name{font-size:13px;font-weight:600;flex:1;}
.uid-val{font-size:10px;color:var(--muted);margin-top:2px;}
.uid-btn{border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-family:'Sarabun',sans-serif;font-weight:600;cursor:pointer;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:white;border-radius:16px;padding:20px;margin:16px;width:100%;max-width:400px;}
.search-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-family:'Sarabun',sans-serif;font-size:14px;margin-bottom:10px;outline:none;}
.search-input:focus{border-color:var(--primary);}
.leave-item{background:white;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,90,156,0.06);}
.toast-msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A2B3C;color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;}
.toast-msg.show{opacity:1;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">⚙️ Settings PEA อ่าวลึก</div>
  <div class="header-sub" id="headerSub">กำลังโหลด...</div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('holiday',this)">📅 วันหยุด</button>
  <button class="tab-btn" onclick="switchTab('team',this)">👨‍💼 บันทึกแทน</button>
  <button class="tab-btn" onclick="switchTab('uid',this)">🆔 จัดการ UID</button>
  <button class="tab-btn" onclick="switchTab('leave',this)">📋 ลางาน</button>
</div>

<div class="content">

<!-- ===== วันหยุด ===== -->
<div class="tab-page active" id="tab-holiday">
  <div class="card">
    <div class="card-title">📅 วันหยุดราชการ PEA 2569-2571</div>
    <div id="holidayList"></div>
  </div>
</div>

<!-- ===== บันทึกแทน ===== -->
<div class="tab-page" id="tab-team">
  <div class="card">
    <div class="card-title">👤 สถานะของคุณวันนี้</div>
    <div id="myStatusBar"><div class="loading">กำลังโหลด...</div></div>
  </div>
  <div id="proxyMsg" style="display:none;background:var(--danger-light);border-radius:12px;padding:14px;font-size:13px;color:var(--danger);text-align:center;margin-bottom:12px"></div>
  <div id="ciSection" style="display:none">
    <div class="card-title" style="color:var(--success);font-size:13px">✅ บันทึกเช็คอินแทน</div>
    <div class="card" style="padding:0;overflow:hidden"><div id="ciList"></div></div>
  </div>
  <div id="coSection" style="display:none;margin-top:4px">
    <div class="card-title" style="color:var(--warning);font-size:13px;margin-top:8px">🚪 บันทึกเช็คเอ้าต์แทน</div>
    <div class="card" style="padding:0;overflow:hidden"><div id="coList"></div></div>
  </div>
  <div id="proxyResult"></div>
</div>

<!-- ===== จัดการ UID ===== -->
<div class="tab-page" id="tab-uid">
  <div class="info-box">🆔 จัดการ LINE UID ของพนักงาน</div>
  <input type="text" class="search-input" placeholder="🔍 ค้นหาชื่อพนักงาน..." oninput="filterUID(this.value)">
  <div id="uidList"><div class="loading"><div class="spinner-sm"></div>กำลังโหลด...</div></div>
</div>

<!-- ===== ลางาน ===== -->
<div class="tab-page" id="tab-leave">
  <div class="card">
    <div class="card-title">📋 ยื่นคำขอลา</div>
    <div class="form-group">
      <label class="form-label">ประเภทการลา <span class="req">*</span></label>
      <select class="form-select" id="leaveType">
        <option value="">-- เลือกประเภท --</option>
        <option value="ลาป่วย">🏥 ลาป่วย</option>
        <option value="ลากิจ">📝 ลากิจ</option>
        <option value="ลาพักร้อน">🏖️ ลาพักร้อน</option>
        <option value="ลาคลอด">👶 ลาคลอด</option>
        <option value="ลาอุปสมบท">🙏 ลาอุปสมบท</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div class="form-group" style="margin:0">
        <label class="form-label">วันเริ่มลา <span class="req">*</span></label>
        <input class="form-input" type="date" id="leaveStart" onchange="calcDays()">
      </div>
      <div class="form-group" style="margin:0">
        <label class="form-label">วันสิ้นสุด <span class="req">*</span></label>
        <input class="form-input" type="date" id="leaveEnd" onchange="calcDays()">
      </div>
    </div>
    <div id="leaveDays" style="text-align:center;font-size:14px;font-weight:700;color:var(--primary);margin-bottom:12px;display:none"></div>
    <div class="form-group">
      <label class="form-label">เหตุผล <span class="req">*</span></label>
      <textarea class="form-input" id="leaveReason" rows="3" placeholder="ระบุเหตุผลการลา"></textarea>
    </div>
    <button class="btn btn-primary" onclick="submitLeave()">📤 ส่งคำขอลา</button>
  </div>
  <div class="card">
    <div class="card-title">📋 ประวัติการลา</div>
    <div id="leaveHistory"><div class="empty">กดแท็บนี้เพื่อดูประวัติ</div></div>
  </div>
</div>

</div><!-- end content -->

<!-- UID Modal -->
<div class="modal-overlay" id="uidModal">
  <div class="modal-box">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">🆔 แก้ไข UID</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px" id="uidModalName">—</div>
    <input type="text" class="search-input" id="uidInput" placeholder="วาง LINE UID ที่นี่...">
    <div style="display:flex;gap:10px;margin-top:4px">
      <button onclick="saveUID()" style="flex:1;padding:12px;background:var(--primary);color:white;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">💾 บันทึก</button>
      <button onclick="document.getElementById('uidModal').classList.remove('show')" style="flex:0.5;padding:12px;background:var(--bg);color:var(--muted);border:none;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxvp0SfzVwAwp0lfGS9OrpdmE0yJ9DlizJY82LIv9G7oxI_oZ4nn9QlxPc-lsx8z7v9/exec';
const LIFF_ID = '2009895943-LOuh7P5F';
const HOLIDAYS = [
  {date:'2026-01-01',name:'วันขึ้นปีใหม่'},{date:'2026-03-03',name:'วันมาฆบูชา'},
  {date:'2026-04-06',name:'วันพระบาทสมเด็จพระพุทธยอดฟ้าฯ'},{date:'2026-04-13',name:'วันสงกรานต์'},
  {date:'2026-04-14',name:'วันสงกรานต์'},{date:'2026-04-15',name:'วันสงกรานต์'},
  {date:'2026-05-01',name:'วันแรงงานแห่งชาติ'},{date:'2026-05-04',name:'วันฉัตรมงคล'},
  {date:'2026-06-03',name:'วันเฉลิมพระชนมพรรษาสมเด็จพระนางเจ้าสุทิดา'},
  {date:'2026-07-28',name:'วันเฉลิมพระชนมพรรษาพระบาทสมเด็จพระเจ้าอยู่หัว'},
  {date:'2026-07-29',name:'วันอาสาฬหบูชา'},{date:'2026-07-30',name:'วันเข้าพรรษา'},
  {date:'2026-08-12',name:'วันเฉลิมพระชนมพรรษาสมเด็จพระนางเจ้าสิริกิติ์'},
  {date:'2026-10-13',name:'วันคล้ายวันสวรรคตฯ'},{date:'2026-10-23',name:'วันปิยมหาราช'},
  {date:'2026-12-07',name:'ชดเชยวันพ่อแห่งชาติ'},{date:'2026-12-10',name:'วันรัฐธรรมนูญ'},
  {date:'2026-12-31',name:'วันสิ้นปี'},
  {date:'2027-01-01',name:'วันขึ้นปีใหม่'},{date:'2027-04-13',name:'วันสงกรานต์'},
  {date:'2027-04-14',name:'วันสงกรานต์'},{date:'2027-04-15',name:'วันสงกรานต์'},
  {date:'2027-07-28',name:'วันเฉลิมพระชนมพรรษาพระบาทสมเด็จพระเจ้าอยู่หัว'},
  {date:'2027-08-12',name:'วันเฉลิมพระชนมพรรษาสมเด็จพระนางเจ้าสิริกิติ์'},
  {date:'2027-12-05',name:'วันพ่อแห่งชาติ'},{date:'2027-12-10',name:'วันรัฐธรรมนูญ'},
  {date:'2027-12-31',name:'วันสิ้นปี'},
];

let currentUser = null;
let allEmployees = [];
let selectedUIDEmpId = null;

// ==================== Init ====================
document.addEventListener('DOMContentLoaded', () => {
  renderHolidays();
  const today = fmtDate(new Date());
  document.getElementById('leaveStart').value = today;
  document.getElementById('leaveEnd').value = today;
  // init LIFF async ไม่บล็อก
  setTimeout(initLiff, 100);
});

async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isInClient() && liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      const res = await gasGet({ action: 'getEmployeeByUID', uid: profile.userId });
      if (res && res.success && res.employee) {
        currentUser = res.employee;
        if (!currentUser.lineUID) currentUser.lineUID = profile.userId;
        document.getElementById('headerSub').textContent = '👤 ' + currentUser.name;
      }
    }
  } catch(e) { console.warn('LIFF:', e.message); }
}

// ==================== Tabs ====================
function switchTab(name, btn) {
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'team')  setTimeout(loadProxyList, 50);
  if (name === 'uid')   setTimeout(loadUIDList, 50);
  if (name === 'leave') setTimeout(loadLeaveHistory, 50);
}

// ==================== วันหยุด ====================
function renderHolidays() {
  const today = fmtDate(new Date());
  const thM = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  document.getElementById('holidayList').innerHTML = HOLIDAYS.map(h => {
    const [y,m,d] = h.date.split('-');
    const past = h.date < today;
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F4F8;opacity:'+(past?'0.4':'1')+'">' +
      '<div style="font-size:12px;font-weight:700;color:var(--primary);min-width:60px">' + d + ' ' + thM[parseInt(m)] + ' ' + (parseInt(y)+543) + '</div>' +
      '<div style="font-size:13px;flex:1">' + h.name + '</div>' +
      (h.date === today ? '<span style="font-size:10px;background:#FFE082;padding:1px 6px;border-radius:10px;color:#5D4037">วันนี้</span>' : '') +
      '</div>';
  }).join('');
}

// ==================== บันทึกแทน ====================
async function loadProxyList() {
  const statusDiv = document.getElementById('myStatusBar');
  const msgDiv = document.getElementById('proxyMsg');
  const ciSec = document.getElementById('ciSection');
  const coSec = document.getElementById('coSection');

  statusDiv.innerHTML = '<div class="loading"><div class="spinner-sm"></div>กำลังโหลด...</div>';
  msgDiv.style.display = 'none';

  if (!currentUser || !currentUser.lineUID) {
    statusDiv.innerHTML = '<div style="color:var(--muted);font-size:13px">⚠️ กรุณาเปิดผ่าน LINE ครับ</div>';
    return;
  }

  const res = await gasGet({ action: 'getProxyList', uid: currentUser.lineUID });

  if (!res || !res.success) {
    statusDiv.innerHTML = '<div style="font-size:13px;color:var(--muted)">—</div>';
    msgDiv.style.display = 'block';
    msgDiv.textContent = res ? res.message : '⚠️ เกิดข้อผิดพลาด';
    return;
  }

  // สถานะตัวเอง
  statusDiv.innerHTML =
    '<div class="status-bar">' +
    '<div class="status-box" style="background:var(--success-light)">' +
      '<div class="status-box-label">เช็คอิน</div>' +
      '<div class="status-box-val" style="color:var(--success)">' + (res.requester.checkIn||'—') + '</div>' +
    '</div>' +
    '<div class="status-box" style="background:'+(res.requester.checkOut?'var(--warning-light)':'#F5F5F5')+'">' +
      '<div class="status-box-label">เช็คเอ้าต์</div>' +
      '<div class="status-box-val" style="color:var(--warning)">' + (res.requester.checkOut||'—') + '</div>' +
    '</div></div>';

  // เช็คอิน
  ciSec.style.display = 'block';
  document.getElementById('ciList').innerHTML = (!res.notCheckedIn||!res.notCheckedIn.length)
    ? '<div class="empty">✅ ทุกคนเช็คอินแล้วครับ</div>'
    : res.notCheckedIn.map(e =>
        '<div class="emp-row">' +
        '<div><div class="emp-name">👤 ' + e.name + '</div><div class="emp-pos">' + e.pos + '</div></div>' +
        '<button class="emp-btn btn-ci" onclick="doProxy(\'checkin\',\'' + e.id + '\',\'' + e.name + '\',this)">✅ เช็คอิน</button>' +
        '</div>'
      ).join('');

  // เช็คเอ้าต์
  if (res.notCheckedOut && res.notCheckedOut.length) {
    coSec.style.display = 'block';
    document.getElementById('coList').innerHTML = res.notCheckedOut.map(e =>
      '<div class="emp-row">' +
      '<div><div class="emp-name">👤 ' + e.name + '</div><div class="emp-pos">' + e.pos + '</div></div>' +
      '<button class="emp-btn btn-co" onclick="doProxy(\'checkout\',\'' + e.id + '\',\'' + e.name + '\',this)">🚪 เช็คเอ้าต์</button>' +
      '</div>'
    ).join('');
  }
}

async function doProxy(action, empId, empName, btn) {
  if (!confirm((action==='checkin'?'เช็คอิน':'เช็คเอ้าต์') + 'ให้ ' + empName + ' เลยไหมครับ?')) return;
  btn.disabled = true; btn.textContent = '⏳';
  const res = await gasGet({
    action: action==='checkin' ? 'proxyCheckin' : 'proxyCheckout',
    requesterUID: currentUser.lineUID,
    targetEmpId: empId
  });
  if (res && res.success) {
    btn.closest('.emp-row').remove();
    showToast(res.message);
  } else {
    btn.disabled = false;
    btn.textContent = action==='checkin' ? '✅ เช็คอิน' : '🚪 เช็คเอ้าต์';
    showToast('❌ ' + (res ? res.message : 'เกิดข้อผิดพลาด'));
  }
}

// ==================== จัดการ UID ====================
async function loadUIDList() {
  document.getElementById('uidList').innerHTML = '<div class="loading"><div class="spinner-sm"></div>กำลังโหลด...</div>';
  const res = await gasGet({ action: 'getEmployeeFull' });
  if (!res || !Array.isArray(res)) {
    document.getElementById('uidList').innerHTML = '<div class="empty">โหลดไม่สำเร็จ</div>'; return;
  }
  allEmployees = res;
  renderUIDList(res);
}

function renderUIDList(list) {
  document.getElementById('uidList').innerHTML = '<div class="card" style="padding:0;overflow:hidden">' +
    list.map(e => {
      const hasUID = e.lineUID && e.lineUID.length > 5;
      return '<div class="uid-row">' +
        '<div style="flex:1;min-width:0"><div class="uid-name">' + e.name + '</div>' +
        '<div class="uid-val">' + (hasUID ? e.lineUID.substring(0,20)+'...' : '⚠️ ยังไม่มี UID') + '</div></div>' +
        '<span class="badge-tag ' + (hasUID?'tag-g':'tag-y') + '">' + (hasUID?'✅ มีแล้ว':'ยังไม่มี') + '</span>' +
        '<button class="uid-btn" onclick="openUID(\'' + e.id + '\',\'' + e.name + '\')" ' +
        'style="background:var(--primary-light);color:var(--primary);margin-left:8px">✏️</button>' +
        '</div>';
    }).join('') + '</div>';
}

function filterUID(q) {
  if (!allEmployees.length) return;
  const f = allEmployees.filter(e => e.name.includes(q));
  renderUIDList(f);
}

function openUID(empId, empName) {
  selectedUIDEmpId = empId;
  document.getElementById('uidModalName').textContent = '👤 ' + empName;
  document.getElementById('uidInput').value = '';
  document.getElementById('uidModal').classList.add('show');
}

async function saveUID() {
  const uid = document.getElementById('uidInput').value.trim();
  if (!uid) { showToast('กรุณาใส่ UID ก่อนครับ'); return; }
  if (!uid.startsWith('U') || uid.length < 30) { showToast('UID ไม่ถูกต้อง ต้องขึ้นต้นด้วย U และยาว 33 ตัวครับ'); return; }
  const res = await gasGet({ action: 'updateUID', empId: selectedUIDEmpId, lineUID: uid });
  document.getElementById('uidModal').classList.remove('show');
  showToast(res && res.success ? '✅ บันทึก UID สำเร็จครับ' : '❌ ' + (res?res.message:'เกิดข้อผิดพลาด'));
  if (res && res.success) loadUIDList();
}

document.getElementById('uidModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('uidModal').classList.remove('show');
});

// ==================== ลางาน ====================
function calcDays() {
  const s = document.getElementById('leaveStart').value;
  const e = document.getElementById('leaveEnd').value;
  const div = document.getElementById('leaveDays');
  if (!s || !e) { div.style.display='none'; return; }
  const days = Math.ceil((new Date(e)-new Date(s))/86400000)+1;
  if (days < 1) { div.style.display='block'; div.textContent='❌ วันสิ้นสุดต้องหลังวันเริ่มต้น'; return; }
  div.style.display='block'; div.textContent='📅 จำนวน ' + days + ' วัน';
}

async function submitLeave() {
  const type = document.getElementById('leaveType').value;
  const start = document.getElementById('leaveStart').value;
  const end = document.getElementById('leaveEnd').value;
  const reason = document.getElementById('leaveReason').value.trim();
  if (!type) { showToast('กรุณาเลือกประเภทการลา'); return; }
  if (!start||!end) { showToast('กรุณาเลือกวันที่'); return; }
  if (!reason) { showToast('กรุณาระบุเหตุผล'); return; }
  if (!currentUser) { showToast('กรุณาเปิดผ่าน LINE ครับ'); return; }
  const res = await gasGet({ action:'submitLeave', empId:currentUser.id, leaveType:type, startDate:start, endDate:end, reason, lineUID:currentUser.lineUID||'' });
  if (res && res.success) {
    showToast('✅ ' + res.message);
    document.getElementById('leaveType').value='';
    document.getElementById('leaveReason').value='';
    loadLeaveHistory();
  } else { showToast('❌ ' + (res?res.message:'เกิดข้อผิดพลาด')); }
}

async function loadLeaveHistory() {
  const div = document.getElementById('leaveHistory');
  if (!currentUser) { div.innerHTML='<div class="empty">กรุณาเปิดผ่าน LINE ครับ</div>'; return; }
  div.innerHTML='<div class="loading"><div class="spinner-sm"></div>กำลังโหลด...</div>';
  const res = await gasGet({ action:'getMyLeaveHistory', uid:currentUser.lineUID||'' });
  if (!res||!Array.isArray(res)||!res.length) { div.innerHTML='<div class="empty">ยังไม่มีประวัติการลา</div>'; return; }
  const sc = {'อนุมัติ':'var(--success)','ไม่อนุมัติ':'var(--danger)','รออนุมัติ':'var(--warning)'};
  div.innerHTML = res.map(r =>
    '<div class="leave-item">' +
    '<div style="display:flex;justify-content:space-between;margin-bottom:4px">' +
      '<span style="font-size:13px;font-weight:600">' + r.type + '</span>' +
      '<span style="font-size:11px;font-weight:600;color:'+(sc[r.status]||'var(--muted)')+'">'+r.status+'</span></div>' +
    '<div style="font-size:12px;color:var(--muted)">📅 '+r.startDate+' - '+r.endDate+' ('+r.days+' วัน)</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:2px">💬 '+r.reason+'</div>' +
    '</div>'
  ).join('');
}

// ==================== Helpers ====================
async function gasGet(params) {
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  try {
    const res = await fetch(url, { redirect:'follow' });
    const text = await res.text();
    return JSON.parse(text);
  } catch(e) { return null; }
}

function fmtDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
